# Runs on every push to any branch and on pull requests: lint, unit and
# integration tests with the coverage minimum, and smoke tests of the running
# service, in memory and against the full stack.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      cassandra:
        image: cassandra:5.0
        ports: ["9042:9042"]
        env:
          MAX_HEAP_SIZE: 1G
          HEAP_NEWSIZE: 256M
        options: >-
          --health-cmd "cqlsh -e 'describe keyspaces'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 30s
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
      kafka:
        image: apache/kafka:3.9.0
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 20s
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports: ["9000:9000"]
        env:
          CLICKHOUSE_DB: shortener
          CLICKHOUSE_USER: shortener
          CLICKHOUSE_PASSWORD: shortener # CI database only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --user shortener --password shortener --query 'SELECT 1'"
          --health-interval 5s
          --health-retries 20
      postgres:
        image: postgres:17
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener # CI database only
          POSTGRES_DB: shortener
        options: >-
          --health-cmd "pg_isready -U shortener"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

      # Includes the full-stack smoke test, whose binaries count toward coverage.
      - name: Tests, smoke test and coverage minimum
        run: make coverage

      - name: Smoke test (in memory)
        run: make smoke

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
