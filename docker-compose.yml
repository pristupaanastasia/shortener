# The project name is fixed, so every checkout (including git worktrees)
# shares one stack instead of starting a second one on the same ports.
name: shortener

services:
  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    environment:
      # Keep the JVM small enough for a laptop.
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
      CASSANDRA_CLUSTER_NAME: shortener
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    # A cache, not a database: bounded memory, evict the least frequently
    # used keys, no persistence.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lfu", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener # local development only
      POSTGRES_DB: shortener
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
      - "9094:9094"
    # A single-node KRaft broker with two listeners: PLAINTEXT advertises
    # localhost:9092 for processes on the host (tests, make run), EXTERNAL
    # advertises host.minikube.internal:9094 for pods in the local minikube
    # cluster (k8s/overlays/local). Setting any listener variable replaces
    # the image defaults, so the whole KRaft config is spelled out.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,EXTERNAL://host.minikube.internal:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: shortener
      CLICKHOUSE_USER: shortener
      CLICKHOUSE_PASSWORD: shortener # local development only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user shortener --password shortener --query 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  clickhouse-data:
  cassandra-data:
  postgres-data:
