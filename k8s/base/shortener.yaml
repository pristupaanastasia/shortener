apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener
spec:
  # No replicas: the HPA owns scaling, and a replicas field here would be
  # reset on every apply. The HPA's minReplicas sets the floor.
  selector:
    matchLabels:
      app.kubernetes.io/name: shortener
  strategy:
    rollingUpdate:
      maxUnavailable: 0 # never below the desired capacity during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shortener
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      # Longer than preStop (5s) plus the server's own shutdown timeout (10s).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless nonroot; a numeric UID lets the kubelet verify it
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shortener
          image: shortener:dev
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9091
          envFrom:
            - configMapRef:
                name: shortener-config
            - secretRef:
                name: shortener-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            # Startup connects to the databases and applies migrations.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          lifecycle:
            preStop:
              # Keep serving while the pod is removed from the Service's
              # endpoints; without this pause, requests still routed to the
              # pod during shutdown fail.
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: shortener
spec:
  selector:
    app.kubernetes.io/name: shortener
  ports:
    # Only traffic: /metrics and /debug/pprof stay off the Service.
    # Prometheus scrapes pods directly (annotations above); restricting pod
    # access to port 9091 needs a NetworkPolicy in a real cluster.
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shortener
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shortener
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shortener
spec:
  # Node drains and cluster upgrades never take more than one pod at a time.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shortener
