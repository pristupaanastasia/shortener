apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shortener
labels:
  - pairs:
      app.kubernetes.io/part-of: shortener
resources:
  - namespace.yaml
  - shortener.yaml
  - consumer.yaml
  - cleanup.yaml
configMapGenerator:
  # Addresses of the dependencies as in-cluster Service names; overlays
  # replace them for their environment. Credentials live in the Secret
  # shortener-secrets, which every overlay must provide.
  - name: shortener-config
    literals:
      - STORAGE=cassandra
      - CASSANDRA_HOSTS=cassandra
      - CASSANDRA_REPLICATION_FACTOR=3
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:9092
      - ADDR=:8080
      # On all pod interfaces, for Prometheus to scrape the pods. It is not
      # in the Service; without a NetworkPolicy, other pods can still reach
      # the pod IP.
      - METRICS_ADDR=:9091
      - BASE_URL=https://sho.rt
      - ARCHIVE_ENDPOINT=s3:8333
      - ARCHIVE_BUCKET=shortener-archive
      - ARCHIVE_SECURE=true
secretGenerator:
  # Declared here (empty) so that the Deployments' references follow the
  # generated name; every overlay must fill it with behavior: merge. The base
  # alone does not run: the shortener refuses to start without POSTGRES_DSN
  # and the consumer without a reachable ClickHouse.
  - name: shortener-secrets
    literals:
      - POSTGRES_DSN=
      - CLICKHOUSE_DSN=
      - ARCHIVE_ACCESS_KEY=
      - ARCHIVE_SECRET_KEY=
