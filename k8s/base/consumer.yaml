apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
spec:
  # Up to the number of partitions of the clicks topic: more consumers in
  # the group than partitions would sit idle.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consumer
    spec:
      # Enough for the final insert attempt (10s) and the offset commit.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless nonroot; a numeric UID lets the kubelet verify it
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          image: shortener:dev
          command: ["/usr/local/bin/consumer"]
          envFrom:
            - configMapRef:
                name: shortener-config
            - secretRef:
                name: shortener-secrets
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
